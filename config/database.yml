default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  local:
    <<: *default
    url: <%= ENV["DATABASE_URL_DEVEL"] %>
    migrations_paths: db/migrate
  supabase:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/migrate

test:
  local:
    <<: *default
    url: <%= ENV["DATABASE_URL_TEST"] %>
    migrations_paths: db/migrate
  supabase:
    <<: *default
    # A second disposable database can be supplied for physical isolation tests.
    # The fallback never points to DATABASE_URL, which may contain real data.
    url: <%= ENV["DATABASE_URL_TEST_SUPABASE"].presence || ENV["DATABASE_URL_TEST"] %>
    migrations_paths: db/migrate

production:
  local:
    <<: *default
    url: <%= ENV["DATABASE_URL_LOCAL"] %>
    migrations_paths: db/migrate
  supabase:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/migrate
